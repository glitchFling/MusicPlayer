# .github/workflows/ios-build.yml
name: iOS Build & Test

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: ⏬ Checkout repository
        uses: actions/checkout@v4

      - name: 🍏 Verify Xcode version
        run: |
          xcode-select -p
          xcodebuild -version

      # -------------------------------------------------
      # 1️⃣ Create a minimal Swift Package and turn it into an Xcode project
      # -------------------------------------------------
      - name: 📦 Initialise Swift package
        run: |
          swift package init --type executable --name MusicPlayer

      - name: 📂 Move source files into the package
        run: |
          # Remove the autogenerated placeholder main.swift
          rm -f Sources/MusicPlayer/main.swift
          # Copy all .swift files from repo root into the Sources folder
          cp *.swift Sources/MusicPlayer/

      - name: 🛠️ Generate Xcode project from package
        run: |
          swift package generate-xcodeproj

      # -------------------------------------------------
      # 2️⃣ Build the app for the iOS Simulator (no signing needed)
      # -------------------------------------------------
      - name: 🛠️ Build for iOS Simulator
        env:
          CODE_SIGNING_ALLOWED: NO
        run: |
          SIM_DEVICE="iPhone 14"
          xcodebuild \
            -project MusicPlayer.xcodeproj \
            -scheme MusicPlayer \
            -destination "platform=iOS Simulator,name=${SIM_DEVICE},OS=latest" \
            clean build | xcpretty

      # -------------------------------------------------
      # 3️⃣ Run tests (if any exist)
      # -------------------------------------------------
      - name: ✅ Run tests (if present)
        if: always()
        env:
          CODE_SIGNING_ALLOWED: NO
        run: |
          SIM_DEVICE="iPhone 14"
          xcodebuild \
            -project MusicPlayer.xcodeproj \
            -scheme MusicPlayer \
            -destination "platform=iOS Simulator,name=${SIM_DEVICE},OS=latest" \
            test | xcpretty

      # -------------------------------------------------
      # 4️⃣ Package the built .app as an artifact
      # -------------------------------------------------
      - name: 📤 Gather the built .app
        id: gather
        run: |
          BUILD_DIR=$(xcodebuild -showBuildSettings \
            -project MusicPlayer.xcodeproj \
            -scheme MusicPlayer \
            -destination "platform=iOS Simulator,name=iPhone 14,OS=latest" \
            | awk '/BUILD_ROOT/ {print $3}')/Debug-iphonesimulator
          APP_PATH="${BUILD_DIR}/MusicPlayer.app"
          echo "App bundle path: $APP_PATH"
          if [[ ! -d "$APP_PATH" ]]; then
            echo "❌ .app not found!"
            exit 1
          fi
          zip -r MusicPlayer.zip "$APP_PATH"
          echo "zip_path=$(pwd)/MusicPlayer.zip" >> $GITHUB_OUTPUT

      - name: 📦 Upload .app artifact
        uses: actions/upload-artifact@v4
        with:
          name: MusicPlayer.app
          path: ${{ steps.gather.outputs.zip_path }}
          retention-days: 7
