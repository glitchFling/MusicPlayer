name: iOS Build & Test

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: ⏬ Checkout repository
        uses: actions/checkout@v4

      - name: 🍏 Set up Xcode
        run: |
          xcode-select -p
          xcodebuild -version

      - name: 📦 Generate Xcode project
        run: |
          PROJECT_NAME=MusicPlayer
          # Create a placeholder pbxproj (will be overwritten by createProject)
          mkdir -p ${PROJECT_NAME}.xcodeproj
          touch ${PROJECT_NAME}.xcodeproj/project.pbxproj
          # Create project and add sources
          xcodebuild -createProject \
            -project ${PROJECT_NAME}.xcodeproj \
            -scheme ${PROJECT_NAME} \
            -target ${PROJECT_NAME} \
            -configuration Debug
          xcodebuild -project ${PROJECT_NAME}.xcodeproj \
            -target ${PROJECT_NAME} \
            -addSourceFiles *.swift

      - name: 🛠️ Build for iOS Simulator
        env:
          CODE_SIGNING_ALLOWED: NO
        run: |
          SIM_DEVICE="iPhone 14"
          xcodebuild \
            -project MusicPlayer.xcodeproj \
            -scheme MusicPlayer \
            -destination "platform=iOS Simulator,name=${SIM_DEVICE},OS=latest" \
            clean build | xcpretty

      - name: ✅ Run tests (if any)
        if: always()
        env:
          CODE_SIGNING_ALLOWED: NO
        run: |
          SIM_DEVICE="iPhone 14"
          xcodebuild \
            -project MusicPlayer.xcodeproj \
            -scheme MusicPlayer \
            -destination "platform=iOS Simulator,name=${SIM_DEVICE},OS=latest" \
            test | xcpretty

      - name: 📤 Gather the built .app
        id: gather
        run: |
          BUILD_DIR=$(xcodebuild -showBuildSettings \
            -project MusicPlayer.xcodeproj \
            -scheme MusicPlayer \
            -destination "platform=iOS Simulator,name=iPhone 14,OS=latest" \
            | awk '/BUILD_ROOT/ {print $3}')/Debug-iphonesimulator
          APP_PATH="${BUILD_DIR}/MusicPlayer.app"
          echo "App bundle path: $APP_PATH"
          if [[ ! -d "$APP_PATH" ]]; then
            echo "❌ .app not found!"
            exit 1
          fi
          zip -r MusicPlayer.zip "$APP_PATH"
          echo "zip_path=$(pwd)/MusicPlayer.zip" >> $GITHUB_OUTPUT

      - name: 📦 Upload .app artifact
        uses: actions/upload-artifact@v4
        with:
          name: MusicPlayer.app
          path: ${{ steps.gather.outputs.zip_path }}
          retention-days: 7
