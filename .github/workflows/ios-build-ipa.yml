# .github/workflows/ios-build-ipa.yml
name: iOS Build & Export Unsigned IPA

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  build:
    runs-on: macos-14
    env:
      CODE_SIGNING_ALLOWED: NO

    steps:
      - name: ⏬ Checkout repository
        uses: actions/checkout@v4

      - name: 🍏 Verify Xcode version
        run: |
          xcode-select -p
          xcodebuild -version

      # -------------------------------------------------
      # 1️⃣ Initialise a Swift package (executable) – gives us a clean Sources folder
      # -------------------------------------------------
      - name: 📦 Initialise Swift package
        run: |
          swift package init --type executable --name MusicPlayer
          mkdir -p Sources/MusicPlayer

      # -------------------------------------------------
      # 2️⃣ Populate package sources with your existing .swift files
      # -------------------------------------------------
      - name: 📂 Populate package sources
        run: |
          echo "--- Repository contents before copy ---"
          ls -R
          rm -f Sources/MusicPlayer/main.swift || true
          mkdir -p Sources/MusicPlayer
          cp *.swift Sources/MusicPlayer/ || true
          echo "--- After copy ---"
          ls -R Sources/MusicPlayer

      # -------------------------------------------------
      # 3️⃣ Create minimal Info.plist (required for an iOS app target)
      # -------------------------------------------------
      - name: 📄 Create Info.plist
        run: |
          cat > Info.plist <<'EOS'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleIdentifier</key><string>com.example.MusicPlayer</string>
              <key>CFBundleName</key><string>MusicPlayer</string>
              <key>CFBundleVersion</key><string>1</string>
              <key>CFBundleShortVersionString</key><string>1.0</string>
              <key>UILaunchStoryboardName</key><string>LaunchScreen</string>
              <key>UIRequiredDeviceCapabilities</key><array><string>armv7</string></array>
              <key>UIInterfaceOrientation</key><string>UIInterfaceOrientationPortrait</string>
              <key>UISupportedInterfaceOrientations</key>
              <array>
                  <string>UIInterfaceOrientationPortrait</string>
                  <string>UIInterfaceOrientationLandscapeLeft</string>
                  <string>UIInterfaceOrientationLandscapeRight</string>
              </array>
          </dict>
          </plist>
          EOS

      # -------------------------------------------------
      # 4️⃣ Install XcodeGen and generate an Xcode project from a spec
      # -------------------------------------------------
      - name: 📐 Install XcodeGen
        run: |
          brew install xcodegen

      - name: 🛠️ Generate Xcode project with XcodeGen
        run: |
          cat > project.yml <<'YAML'
          name: MusicPlayer
          options:
            bundleIdPrefix: com.example
          settings:
            PRODUCT_BUNDLE_IDENTIFIER: com.example.MusicPlayer
            INFOPLIST_FILE: Info.plist
          targets:
            MusicPlayer:
              type: application
              platform: iOS
              sources: [Sources/MusicPlayer]
              settings:
                INFOPLIST_FILE: Info.plist
          YAML
          xcodegen

      # -------------------------------------------------
      # 5️⃣ Build & archive (unsigned) for the iOS Simulator
      # -------------------------------------------------
      - name: 🏗️ Build & archive (unsigned)
        run: |
          SIM_DEVICE="iPhone 14"
          # Build for simulator to produce the .app
          xcodebuild \
            -project MusicPlayer.xcodeproj \
            -scheme MusicPlayer \
            -destination "platform=iOS Simulator,name=${SIM_DEVICE},OS=latest" \
            clean build

          # Archive – CODE_SIGNING_ALLOWED=NO makes the archive unsigned
          xcodebuild \
            -project MusicPlayer.xcodeproj \
            -scheme MusicPlayer \
            -archivePath $PWD/MusicPlayer.xcarchive \
            archive

      # -------------------------------------------------
      # 6️⃣ Export an unsigned .ipa from the archive
      # -------------------------------------------------
      - name: 📦 Export unsigned IPA
        run: |
          cat > ExportOptions.plist <<'EOS'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key><string>development</string>
              <key>signingStyle</key><string>manual</string>
              <key>allowProvisioningUpdates</key><true/>
          </dict>
          </plist>
          EOS

          xcodebuild -exportArchive \
            -archivePath $PWD/MusicPlayer.xcarchive \
            -exportPath $PWD/ExportedIPA \
            -exportOptionsPlist ExportOptions.plist

          cd ExportedIPA
          zip -r MusicPlayer.ipa.zip *.ipa
          echo "ipa_zip_path=$(pwd)/MusicPlayer.ipa.zip" >> $GITHUB_OUTPUT

      # -------------------------------------------------
      # 7️⃣ Upload the unsigned IPA as a GitHub artifact
      # -------------------------------------------------
      - name: 📤 Upload unsigned IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: MusicPlayer.unsigned.ipa
          path: ${{ steps.export-ipa.outputs.ipa_zip_path }}
          retention-days: 7
