# .github/workflows/ios-build-ipa.yml
name: iOS Build & Export Unsigned IPA

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  build:
    runs-on: macos-14
    env:
      # Force unsigned build – no signing certificates required
      CODE_SIGNING_ALLOWED: NO

    steps:
      - name: ⏬ Checkout repository
        uses: actions/checkout@v4

      - name: 🍏 Verify Xcode version
        run: |
          xcode-select -p
          xcodebuild -version

      # -------------------------------------------------
      # 1️⃣ Initialise a Swift package (executable) – gives us a clean Sources folder
      # -------------------------------------------------
      - name: 📦 Initialise Swift package
        run: |
          swift package init --type executable --name MusicPlayer
          # Ensure the source directory exists (SwiftPM creates Sources/<PackageName>)
          mkdir -p Sources/MusicPlayer

      # -------------------------------------------------
      # 2️⃣ Populate package sources with your existing .swift files
      # -------------------------------------------------
      - name: 📂 Populate package sources
        run: |
          echo "--- Repository contents before copy ---"
          ls -R
          # Remove the placeholder main.swift that SwiftPM generated
          rm -f Sources/MusicPlayer/main.swift || true
          # Verify the target folder exists (create if somehow missing)
          mkdir -p Sources/MusicPlayer
          # Copy every .swift file from the repo root into the package source folder
          cp *.swift Sources/MusicPlayer/ || true
          echo "--- After copy ---"
          ls -R Sources/MusicPlayer

      # -------------------------------------------------
      # 3️⃣ Generate Xcode project from the package
      # -------------------------------------------------
      - name: 🛠️ Generate Xcode project
        run: |
          swift package generate-xcodeproj

      # -------------------------------------------------
      # 4️⃣ Build & archive (unsigned) for the iOS Simulator
      # -------------------------------------------------
      - name: 🏗️ Build & archive (unsigned)
        run: |
          SIM_DEVICE="iPhone 14"
          # Build for simulator to produce the .app
          xcodebuild \
            -project MusicPlayer.xcodeproj \
            -scheme MusicPlayer \
            -destination "platform=iOS Simulator,name=${SIM_DEVICE},OS=latest" \
            clean build

          # Archive – CODE_SIGNING_ALLOWED=NO produces an unsigned archive
          xcodebuild \
            -project MusicPlayer.xcodeproj \
            -scheme MusicPlayer \
            -archivePath $PWD/MusicPlayer.xcarchive \
            archive

      # -------------------------------------------------
      # 5️⃣ Export an unsigned .ipa from the archive
      # -------------------------------------------------
      - name: 📦 Export unsigned IPA
        run: |
          cat > ExportOptions.plist <<'EOS'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key><string>development</string>
              <key>signingStyle</key><string>manual</string>
              <key>allowProvisioningUpdates</key><true/>
          </dict>
          </plist>
          EOS

          xcodebuild -exportArchive \
            -archivePath $PWD/MusicPlayer.xcarchive \
            -exportPath $PWD/ExportedIPA \
            -exportOptionsPlist ExportOptions.plist

          # Zip the IPA for artifact upload
          cd ExportedIPA
          zip -r MusicPlayer.ipa.zip *.ipa
          echo "ipa_zip_path=$(pwd)/MusicPlayer.ipa.zip" >> $GITHUB_OUTPUT

      # -------------------------------------------------
      # 6️⃣ Upload the unsigned IPA as a GitHub artifact
      # -------------------------------------------------
      - name: 📤 Upload unsigned IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: MusicPlayer.unsigned.ipa
          path: ${{ steps.export-ipa.outputs.ipa_zip_path }}
          retention-days: 7
